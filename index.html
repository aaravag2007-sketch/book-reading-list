<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090b12"><title>Reading List | Aarav</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body><main class="app"><header><p class="eyebrow">PERSONAL LIBRARY</p><h1>My <span>Reading List</span></h1><p class="sub">A little progress every day adds up.</p></header>
<form id="bookForm" class="add-form"><label class="sr-only" for="bookTitle">Book title</label><input id="bookTitle" maxlength="100" placeholder="Add a book title…" required><label class="sr-only" for="bookAuthor">Author</label><input id="bookAuthor" maxlength="80" placeholder="Author (optional)"><button type="submit">+ Add book</button></form>
<div class="toolbar"><div class="filters" role="group" aria-label="Filter books"><button class="filter active" data-filter="all" type="button">All</button><button class="filter" data-filter="unread" type="button">To read</button><button class="filter" data-filter="read" type="button">Finished</button></div><span id="count">0 books</span></div><ul id="bookList" class="book-list" aria-live="polite"></ul><p id="empty" class="empty">Your reading list is empty. Add your first book above.</p><footer>Saved locally in this browser · HTML, CSS & JavaScript</footer></main></body></html>
